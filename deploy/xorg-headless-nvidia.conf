# GPU-accelerated headless X screen on the RTX 4080, for running TM2020 off
# the desktop at full frame rate. Xvfb is a software X server: the game's
# swapchain present is a per-frame memcpy that tops out ~50fps, and TM2020
# ramps analogue steering PER FRAME, so the ramp never completes and the
# trainer sees "the game is applying 24% of the steering we send". A GPU X
# screen presents GPU->GPU and runs at full speed.
#
# UseDisplayDevice "none" + no ConnectedMonitor: render to an OFFSCREEN GPU
# buffer, never touch KMS. This is the only way to coexist with the Wayland
# desktop, which already holds DRM modesetting master - with a real display
# device the nvidia driver fails with "Failed to acquire modesetting
# permission".
#
# Start with tools/xorg-headless.sh (needs sudo).

Section "ServerLayout"
    Identifier "HeadlessLayout"
    Screen 0 "HeadlessScreen"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "HeadlessDevice"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"          # RTX 4080 at 00000000:01:00.0
    Option     "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier "HeadlessScreen"
    Device     "HeadlessDevice"
    DefaultDepth 24
    Option     "UseDisplayDevice" "none"
    SubSection "Display"
        Depth   24
        Virtual 1920 1080
    EndSubSection
EndSection
